# Kibana configuration
# Detection-as-Code-with-AI — Phase 1

server.host: "0.0.0.0"
server.port: 5601
server.name: "detection-as-code-kibana"
server.ssl.enabled: true
server.ssl.certificate: "/usr/share/kibana/config/certs/kibana-server.crt"
server.ssl.key: "/usr/share/kibana/config/certs/kibana-server.key"
server.ssl.supportedProtocols: ["TLSv1.2", "TLSv1.3"]

# Elasticsearch connection
elasticsearch.hosts: ["https://elasticsearch:9200"]
elasticsearch.ssl.certificateAuthorities: ["/usr/share/kibana/config/certs/ca.crt"]
elasticsearch.ssl.verificationMode: full
elasticsearch.serviceAccountToken: "${KIBANA_SERVICE_ACCOUNT_TOKEN}"

# Saved-object key must remain stable across container recreation.
xpack.encryptedSavedObjects.encryptionKey: "${KIBANA_ENCRYPTION_KEY}"

# Logging
logging.root.level: warn

# Disable telemetry
telemetry.enabled: false
telemetry.optIn: false

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Local Docker infrastructure</title>
  <desc id="description">Local development environment, not a production deployment. Three containers share the detection_network bridge network. Kibana on port 5601 connects to Elasticsearch on port 9200 using a service-account token. n8n exposes port 5678; automation workflows are planned. Each container has persistent storage.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #526176; }
      .label { font-size: 14px; font-weight: 600; letter-spacing: 1px; }
      .name { font-size: 25px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; fill: #526176; }
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 14px; }
      .connection { font-size: 14px; fill: #1d4ed8; font-weight: 600; }
    </style>
  </defs>
  <rect width="1200" height="720" rx="20" fill="#f7f9fc"/>
  <text x="48" y="57" class="title">Local Docker infrastructure</text>
  <text x="48" y="86" class="subtitle">Local development environment — not a production deployment</text>

  <rect x="40" y="118" width="1120" height="490" rx="18" fill="#edf2f9" stroke="#c8d3e2"/>
  <text x="64" y="151" class="label">DOCKER COMPOSE · detection_network (bridge)</text>

  <rect x="64" y="180" width="320" height="304" rx="14" fill="#fff" stroke="#b8cdeb"/>
  <rect x="64" y="180" width="320" height="8" rx="4" fill="#2563eb"/>
  <text x="88" y="225" class="name">Kibana</text>
  <text x="88" y="253" class="mono">container: kibana</text>
  <text x="88" y="292" class="body">Security UI and query console</text>
  <text x="88" y="320" class="small">Custom dashboards planned</text>
  <text x="88" y="365" class="label">HOST → CONTAINER</text>
  <text x="88" y="394" class="mono">localhost:5601 → 5601</text>
  <text x="88" y="438" class="small">Starts after Elasticsearch is healthy</text>

  <rect x="440" y="180" width="320" height="304" rx="14" fill="#fff" stroke="#8ecfc5"/>
  <rect x="440" y="180" width="320" height="8" rx="4" fill="#0d9488"/>
  <text x="464" y="225" class="name">Elasticsearch</text>
  <text x="464" y="253" class="mono">container: elasticsearch</text>
  <text x="464" y="292" class="body">Search and security data store</text>
  <text x="464" y="320" class="small">Single node · authentication enabled</text>
  <text x="464" y="365" class="label">HOST → CONTAINER</text>
  <text x="464" y="394" class="mono">localhost:9200 → 9200</text>
  <text x="464" y="438" class="small">HTTP REST API inside the network</text>

  <rect x="816" y="180" width="320" height="304" rx="14" fill="#fff" stroke="#c8b8e7"/>
  <rect x="816" y="180" width="320" height="8" rx="4" fill="#7c3aed"/>
  <text x="840" y="225" class="name">n8n</text>
  <text x="840" y="253" class="mono">container: n8n</text>
  <text x="840" y="292" class="body">Workflow automation runtime</text>
  <text x="840" y="320" class="small">Alert routing and enrichment planned</text>
  <text x="840" y="365" class="label">HOST → CONTAINER</text>
  <text x="840" y="394" class="mono">localhost:5678 → 5678</text>
  <text x="840" y="438" class="small">No alert workflows implemented yet</text>

  <path d="M 224 484 L 224 528 L 600 528 L 600 486" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="244" y="553" class="connection">Kibana → http://elasticsearch:9200</text>
  <text x="244" y="576" class="small">Service account: elastic/kibana · token supplied through environment</text>

  <text x="48" y="643" class="label">PERSISTENT NAMED VOLUMES</text>
  <text x="48" y="670" class="mono">kibana_data</text>
  <text x="440" y="670" class="mono">elasticsearch_data</text>
  <text x="816" y="670" class="mono">n8n_data</text>
  <text x="48" y="701" class="small">Ports reflect local .env settings. Source: infra/docker-compose.yml. Planned integrations are not drawn as active connections.</text>
</svg>
